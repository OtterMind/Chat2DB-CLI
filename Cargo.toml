[package]
name = "chat2db"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Official command-line interface for Chat2DB Community, Pro, and Local"
license = "Apache-2.0"
repository = "https://github.com/OtterMind/Chat2DB-CLI"
readme = "README.md"
keywords = ["chat2db", "database", "sql", "cli", "mcp"]
categories = ["command-line-utilities", "database"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1"
fs2 = "0.4"
getrandom = "0.4"
libc = "0.2"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusty-leveldb = "4.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
url = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
